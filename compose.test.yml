services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appsec
      POSTGRES_USER: appsec
      POSTGRES_PASSWORD: appsec-demo-only
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appsec -d appsec"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - lab

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://appsec:appsec-demo-only@db:5432/appsec
      PORT: '3000'
      ENABLE_CSP: 'true' # Change to 'false' ONLY for scenario B
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lab

networks:
  lab:
    name: appsec-unified-ci
